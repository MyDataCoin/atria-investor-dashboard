name: CI + Deploy
# Build & lint on every push/PR; deploy the static bundle to the Ubuntu server only on
# pushes to the default branch (and manual runs). All connection details are GitHub
# Secrets — nothing sensitive lives in this file.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # VITE_* vars are inlined at build time, so the API base URL must be present
        # here (not on the server). It is exposed to the browser anyway, so it is a plain
        # value, not a secret — change it here if the backend URL changes.
        env:
          VITE_API_BASE_URL: https://atria-api.eaysdev.online
        run: npm run build

      - name: Upload built bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  security:
    name: Dependencies & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still a leaked secret.
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails on a high or critical advisory in anything that ships to the browser.
      - name: Audit runtime dependencies
        run: npm run audit

      - name: Gitleaks
        # The gitleaks ACTION requires a paid licence for organisation-owned repositories; the
        # scanner it wraps does not. Pinned by digest-less tag on the official image, which is the
        # same binary without the licence check.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source . --redact --no-banner --verbose

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build-test, security]
    # Never deploy from pull requests (incl. forks) — only direct pushes / manual runs.
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check deploy credentials
        # appleboy/ssh-action reports a missing key as "can't connect without a private SSH key or
        # password", which does not say WHICH secret is absent or what to do about it. Fail here
        # instead, before a bundle is built and copied, with the actual instruction.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          # Either credential will do. The key is preferred; the password keeps the deploy
          # working until one is issued.
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_SSH_PASSWORD" ]; then
            missing="$missing DEPLOY_SSH_KEY-or-DEPLOY_SSH_PASSWORD"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Set DEPLOY_SSH_PASSWORD to deploy with the password you already have, or"
            echo "DEPLOY_SSH_KEY to switch to key authentication (preferred — the same session"
            echo "carries the database password and the provider API keys to the server):"
            echo "  ssh-keygen -t ed25519 -C 'github-actions-deploy' -f ./atria_deploy -N ''"
            echo "  ssh-copy-id -i ./atria_deploy.pub $DEPLOY_USER@$DEPLOY_HOST"
            echo "  gh secret set DEPLOY_SSH_KEY < ./atria_deploy   # the PRIVATE key, whole file"
            echo "  rm ./atria_deploy ./atria_deploy.pub"
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploying with a PASSWORD. This session also carries the database" \
                 "password and the provider API keys — move to DEPLOY_SSH_KEY when one is issued."
          else
            echo "Deploying with an SSH key."
          fi

      - name: Download built bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Package deployment bundle
        # Ship the already-built static files — no Node/build toolchain needed on the server.
        run: tar -czf deploy.tar.gz -C dist .

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          source: "deploy.tar.gz"
          target: "/opt/atria-dashboard"
          overwrite: true

      - name: Publish the bundle on the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          # nginx web root the SPA is served from. Change to match your server config.
          WEB_ROOT: /var/www/atria-dashboard
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          envs: WEB_ROOT
          script: |
            set -euo pipefail

            cd /opt/atria-dashboard

            # Unpack the new bundle into a clean staging dir, then swap it into the web root
            # atomically-ish so visitors never see a half-copied site. Wiping staging first
            # prunes files deleted in git (tar -x overlays but never removes stale assets).
            rm -rf release
            mkdir -p release
            tar -xzf deploy.tar.gz -C release
            rm -f deploy.tar.gz

            # Stage the new site next to the web root (same filesystem) so the
            # cutover is a rename rather than a slow in-place copy. rsync isn't
            # installed on the server, so cp + mv stand in for it — and this also
            # prunes files deleted in the build, since the live dir is replaced
            # wholesale rather than overlaid.
            STAGE="$WEB_ROOT.incoming"
            sudo rm -rf "$STAGE" "$WEB_ROOT.old"
            sudo mkdir -p "$STAGE"
            sudo cp -a release/. "$STAGE"/

            # Swap: move the live dir aside, drop the new one in, prune the old.
            # Both mv's are renames on one filesystem, so the window where the site
            # is absent is two instantaneous operations rather than a full copy.
            if [ -d "$WEB_ROOT" ]; then
              sudo mv "$WEB_ROOT" "$WEB_ROOT.old"
            fi
            sudo mv "$STAGE" "$WEB_ROOT"
            sudo rm -rf "$WEB_ROOT.old"

            ls -la "$WEB_ROOT"
